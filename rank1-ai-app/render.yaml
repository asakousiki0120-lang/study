services:
  - type: web
    name: rank1-ai-study
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: node server-render.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: study-db
          property: connectionString

databases:
  - name: study-db
    databaseName: study_db
    user: study_user
    plan: free
    region: oregon
