services:
  - type: web
    name: rank1-ai-app
    env: node
    region: tokio
    plan: free
    buildCommand: npm install
    startCommand: npm run start:render
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: rank1-db
          property: connectionString

  - type: pserv
    name: rank1-db
    plan: free
    databaseName: rank1db
